<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array and Loops</title>
</head>

<body>
    <h3>Array and Loops </h3>
    <script>
       
        function doubleArray(nums) {
            const numsDouble = [];
            for (let i = 0; i < nums.length; i++) {
                const num = nums[i];
                if (num === 0) {
                    return numsDouble;
                }
                numsDouble.push(num * 2);
            }
            return numsDouble;
        }
        console.log(doubleArray([1, 2, 3, 4]));
        console.log(doubleArray([1, 1, 1, 1, 0, 10]))
    </script>
</body>

</html>
