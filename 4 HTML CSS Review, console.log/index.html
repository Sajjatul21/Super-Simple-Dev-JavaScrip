<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML CSS Review</title>
    <style>
        .red-button {
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .yellow-button {
            background-color: yellow;
        }
    </style>
</head>

<body>
    <button class="red-button">Hello</button>
    <p>paragraph of <button class="yellow-button">Hello</button> text</p>
</body>

</html>
