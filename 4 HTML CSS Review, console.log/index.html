<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML CSS Review</title>
    <style>
        /* css comment */
        .red-button {
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .yellow-button {
            background-color: yellow;
        }
    </style>
</head>

<body>
    <button class="red-button" onclick="alert('hello')">Hello</button>
    <!-- onclick-> runs after (when click the button) -->
    <p>paragraph of <button class="yellow-button">Hello</button> text</p>
    <script>
        // alert('Hello') // runs first (when the page is loaded)
        /* multiline
            comment
          */
         console.log(2 + 2)
         console.log("text" + "Something")
    </script>
</body>

</html>
