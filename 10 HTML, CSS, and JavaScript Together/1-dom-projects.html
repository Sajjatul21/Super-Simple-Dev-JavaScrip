<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Exercises</title>
    <style>
        body {
            font-family: Arial;
        }

        .subscribe-button {
            border: none;
            background-color: black;
            color: white;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .is-subscribe {
            background-color: rgb(240, 240, 240);
            color: black;
        }
    </style>
</head>

<body>
    <p>Youtube Subscribe Button</p>
    <button onclick="
    subscribe()
" class="js-subscribe-button subscribe-button"> Subscribe</button>

    <p>Amazon Shipping Calculator</p>
    <input class="js-cost-input" placeholder="Cost of order" onkeydown="
        handleCostKeyDown(event)

    ">

    <button onclick="
        calculateTotal()
    ">Calculate</button>
    <p class="js-total-cost"></p>
    <script>

        function handleCostKeyDown() {
            if (event.key === "Enter") {
                calculateTotal();
            }
        }
        function calculateTotal() {
            const inputElement = document.querySelector('.js-cost-input');
            let cost = Number(inputElement.value);
            // let cost = inputElement.value;
            if (cost < 40) {
                cost = cost + 10;
            }
            document.querySelector('.js-total-cost').innerHTML = `$${cost}`;
        }


        function subscribe() {
            const buttonElement = document.querySelector('.js-subscribe-button');
            if (buttonElement.innerText === 'Subscribe') {
                buttonElement.innerHTML = 'Subscribed';
                buttonElement.classList.add('is-subscribe');
            }
            else {
                buttonElement.innerHTML = 'Subscribe';
                buttonElement.classList.remove('is-subscribe');
            }
        }
    </script>
</body>

</html>
