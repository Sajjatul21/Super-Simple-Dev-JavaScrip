<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advance Function</title>
</head>

<body>
    <h3>Advance Function</h3>

    <script>
        [
            'make dinner',
            'wish dishes',
            'watch youtube'
        ].forEach((value, index) => {
            if (value === 'wash dishes') {
                return;
            }
            console.log(index, value);
        });


        const regularFunction = function (param, param2) {
            console.log("Hello");
            return 5;
        };

        const arrowFunction = (param, param2) => {
            console.log('Hello');
            return 5;
        };
        arrowFunction();

        const oneParam = param => {
            console.log(param + 1);
        };
        oneParam(2);

        const oneLine = () => 2 + 3;
        console.log(oneLine())


    </script>
</body>

</html>
