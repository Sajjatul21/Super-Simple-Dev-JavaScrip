        /* 
        Accumulator pattern 
            1. create a variable to store the result 
            2. loop thought the array and update result
         */
        const nums = [1, 2, 3];
        let total = 0; // accumulator variable
        for (let i = 0; i < nums.length; i++) {
            const num = nums[i];
            total += num;
        }
        console.log(total);


        const numsDouble = [];
        for (let i = 0; i < nums.length; i++) {
            const num = nums[i];
            numsDouble.push(num * 2);
        }
        console.log(numsDouble)
