<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable</title>
</head>

<body>
    <h1>Variable</h1>

    <script>
        let variable1 = 3;
        console.log(variable1);

        let calculate = 2 + 2;
        console.log(calculate);
        console.log(calculate + 2);

        let result = calculate + 2;
        console.log(result);

        let message = 'Hello';
        console.log(message);

        // re-assign variable
        variable1 = 5;
        console.log(variable1);

        variable1= variable1 + 1
        console.log(variable1)

    </script>
</body>

</html>
